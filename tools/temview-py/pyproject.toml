[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temview"
version = "0.1.0"
description = "Script the TEM-view electron microscope simulator from Python: headless, or driving an open exhibit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "All rights reserved; license to be decided. See LICENSE in the repository." }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
live = ["websockets>=13"]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://advanced-em.github.io/TEM-view/"
Source = "https://github.com/Advanced-EM/TEM-view/tree/main/tools/temview-py"

[tool.setuptools]
packages = ["temview"]

[tool.setuptools.package-data]
temview = ["driver.mjs"]
