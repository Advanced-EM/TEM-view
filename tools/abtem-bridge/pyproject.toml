[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temview-abtem"
version = "0.1.0"
description = "Run TEM-view's microscope state as an abTEM multislice simulation"
requires-python = ">=3.11"
# This package imports abTEM (GPL-3.0-or-later); see README "Licensing" before distributing it.
license = { text = "Copyright © 2026 by Northwestern University. All Rights Reserved. License to be decided with the abTEM authors (GPL-3.0-or-later compatible)." }
dependencies = ["abtem>=1.0.11", "ase>=3.23", "numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]
gpu = ["cupy-cuda12x"]

[project.scripts]
temview-abtem = "temview_abtem.cli:main"

[tool.setuptools.packages.find]
include = ["temview_abtem*"]
