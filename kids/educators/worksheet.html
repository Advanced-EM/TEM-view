<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electron Explorer worksheet</title>
<meta name="description" content="A printable worksheet for Electron Explorer, the cartoon electron microscope, in English, Spanish, Portuguese, French and German.">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  :root { --ink: #1d2340; --muted: #5a6285; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 'Nunito', system-ui, sans-serif; color: var(--ink); background: #eef4ff; }
  .bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 12px; }
  .bar button, .bar a { font: 700 14px 'Fredoka', sans-serif; border: 2px solid var(--ink); border-radius: 999px; background: #fff; padding: 4px 12px; cursor: pointer; color: var(--ink); text-decoration: none; }
  .bar button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .page { background: #fff; max-width: 820px; margin: 0 auto 24px; padding: 32px 40px; border: 2px solid var(--ink); border-radius: 18px; }
  h1 { font: 700 26px 'Fredoka', sans-serif; margin: 0 0 4px; } h2 { font: 700 18px 'Fredoka', sans-serif; margin: 22px 0 6px; }
  .who { display: flex; gap: 24px; margin: 12px 0 4px; } .who span { flex: 1; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
  .q { margin: 14px 0; } .q b { font-family: 'Fredoka', sans-serif; }
  .lines { border-bottom: 1.5px dotted var(--muted); height: 30px; } .box { border: 2px dashed var(--muted); border-radius: 12px; height: 150px; margin-top: 6px; }
  .order { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; } .order span { flex: 1 1 120px; border-bottom: 1.5px solid var(--ink); padding: 18px 0 2px; color: var(--muted); font-size: 12px; }
  .chips { color: var(--muted); font-size: 14px; } .muted { color: var(--muted); font-size: 13px; }
  .key { font-size: 14px; } .key li { margin-bottom: 4px; }
  @media print { body { background: #fff; } .bar { display: none; } .page { border: 0; margin: 0; max-width: none; padding: 0 6mm; } .page + .page { break-before: page; } @page { margin: 14mm; } }
</style>
</head>
<body>
<div class="bar" role="group" aria-label="Language">
  <button data-l="en">English</button><button data-l="es">Español</button><button data-l="pt">Português</button><button data-l="fr">Français</button><button data-l="de">Deutsch</button>
  <button id="print">🖨️ <span data-t="print"></span></button><a href="../" data-t="open"></a>
</div>
<main>
  <section class="page">
    <h1 data-t="title"></h1>

    <div class="q"><b>4.</b> <span data-t="q4"></span><p class="chips" data-t="q4c"></p><div class="order"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>
    <div class="q"><b>5.</b> <span data-t="q5"></span><div class="lines"></div></div>
    <div class="q"><b>6.</b> <span data-t="q6"></span><div class="lines"></div><div class="lines"></div></div>
    <div class="q"><b>7.</b> <span data-t="q7"></span><div class="box"></div></div>
    <div class="q"><b>8.</b> <span data-t="q8"></span><div class="lines"></div><div class="lines"></div></div>
  </section>
  <section class="page key">
    <h2 data-t="keyT"></h2>
    <ol><li data-t="k1"></li><li data-t="k2"></li><li data-t="k3"></li><li data-t="k4"></li><li data-t="k5"></li><li data-t="k6"></li><li data-t="k7"></li><li data-t="k8"></li></ol>

  </section>
</main>
<script>

const ok = (l) => l in T;
let lang = new URLSearchParams(location.search).get('lang'); if (!ok(lang)) { try { lang = localStorage.getItem('kids-lang'); } catch { lang = null; } } if (!ok(lang)) lang = ok(navigator.language.slice(0, 2)) ? navigator.language.slice(0, 2) : 'en';
function show(l) {
  lang = l; document.documentElement.lang = l;

  document.querySelectorAll('[data-l]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === l));
  document.title = T[l].title; document.querySelector('[data-t="open"]').href = `../?lang=${l}`;
