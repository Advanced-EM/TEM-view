<style>
  .stk { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; text-align: center; }
  .stk h1 { font: 700 1.7rem 'Fredoka', sans-serif; margin: 6px 0 14px; }
  #stImg { width: min(100%, 420px); aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); background: #04060c; }
  .stk .stars { font-size: 1.8rem; margin: 10px 0 0; }
  .stk .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
  .stk .cb { text-decoration: none; }
</style>

<body>
<main class="stk">
  <p class="eyebrow" data-i18n="stEyebrow">Electron Explorer</p>
  <h1 data-i18n="stTitle">My sticker from the electron microscope</h1>
  <img id="stImg" alt="">
  <p class="stars" id="stStars"></p>
  <p id="stName"></p>
  <p id="stWhat" class="muted"></p>
  <p id="stSize" class="muted"></p>
  <div class="row">
    <a class="cb snap" id="stSave" data-i18n="stSave">⬇️ Save the picture</a>
    <button type="button" class="cb" id="stShare" hidden data-i18n="stShare">📤 Share</button>
    <a class="cb" id="stPlay" href="./" data-i18n="stPlay">🔬 Play Electron Explorer</a>
  </div>
  <p class="muted" data-i18n="stNote">This picture was redrawn on your phone from a few numbers in the address. Nothing about you was saved.</p>
</main>
