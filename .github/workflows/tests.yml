name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: for f in js/*.js scanning/*.js; do node --check "$f"; done
      - name: Scanning 1938–2002 physics
        run: node scanning/test.mjs
      - name: Python package (headless simulator)
        run: |
          pip install -e "tools/temview-py[test,plot]"
          pytest -q tools/temview-py/tests
      - name: abTEM bridge (requests and specimens; abTEM runs are skipped without abTEM)
        run: |
          pip install ase scipy
          pytest -q tools/abtem-bridge/tests
      - name: Example automation runs
        run: python tools/temview-py/examples/quickstart.py
        env:
          MPLBACKEND: Agg
      - name: temview-connect (protocol, Tier 2 compute) and the browser client against it
        run: |
          pip install -e tools/connect
          pytest -q tools/connect/tests
          node tools/remote-check.mjs
      - name: Tier 3 job bundle, run with its own runner and read back
        run: node tools/bundle-check.mjs
      - name: Environment registry (holders as before, windows in every technique)
        run: node tools/env-check.mjs
      - name: MCP server
        run: cd tools/temview-mcp && npm ci && node test.mjs
      - name: Collector Worker
        run: cd hf/worker && node test.mjs
  gpu:
    # the WebGPU kernels (js/gpu.js) against the JS reference kernels, in headless Chromium on the software
    # adapter (SwiftShader): runners have no GPU, but the arithmetic is the same
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright Chromium
        run: npm i --no-save --no-package-lock playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: WebGPU kernels (FFT, multislice, WBP, SIRT, worker jobs)
        run: node tools/gpu-check.mjs
        env:
          GPU_ADAPTER: swiftshader
