<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEM-view Console enclosure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #050608; --panel: #0b0e13; --line: rgba(255,255,255,0.09); --text: #e9edf2; --muted: #8a94a3; --accent: #6fd6ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 'IBM Plex Sans', system-ui, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .card { position: fixed; left: 16px; top: 16px; max-width: 340px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  h1 { margin: 0 0 4px; font: 400 30px/1.05 'Instrument Serif', Georgia, serif; }
  h1 em { color: var(--accent); }
  p { margin: 0 0 10px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  button { font: 500 13px 'IBM Plex Sans', sans-serif; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; font: 12.5px/1.9 'IBM Plex Mono', monospace; }
  a { color: var(--accent); }
  .err { color: #ff8a80; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="card">
  <h1>Console <em>enclosure</em></h1>
  <p>Prototype parts for 3D printing. Drag to orbit, scroll to zoom.</p>
  <div class="row"><button id="explode" aria-pressed="false">Exploded view</button><button id="spin" aria-pressed="true">Turntable</button></div>
  <ul>
    <li><a href="stl/top_plate.stl">top_plate.stl</a> · print face down</li>
    <li><a href="stl/base.stl">base.stl</a> · print upright</li>
    <li><a href="stl/focus_dial.stl">focus_dial.stl</a> · 1×</li>
    <li><a href="stl/knob.stl">knob.stl</a> · 5×</li>
    <li><a href="stl/diffuser_ring.stl">diffuser_ring.stl</a> · clear PETG</li>
    <li><a href="stl/light_bar.stl">light_bar.stl</a> · clear PETG</li>
  </ul>
  <p id="msg"></p>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const cv = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050608);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(150, 300, 200); scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fdcff, 1.2); rim.position.set(-220, 150, -300); scene.add(rim);
const camera = new THREE.PerspectiveCamera(30, 1, 5, 5000);
camera.position.set(260, 280, 420);
const controls = new OrbitControls(camera, cv);
controls.target.set(0, 20, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.6;

// how far each part rises in the exploded view (mm)
const lift = (name) => name === 'base' || name === 'light_bar' ? 0 : name === 'diffuser_ring' ? 30 : name === 'top_plate' ? 45 : 85;
const parts = [];
new GLTFLoader().load('assembly.glb', (g) => {
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.deleteAttribute('color');
    const name = o.name, glow = name.startsWith('diffuser') || name.startsWith('light_bar');
    const color = name === 'base' ? 0x111317 : name === 'top_plate' ? 0x1f242c : name.startsWith('key') ? 0x16191e : glow ? 0x6fd6ff : 0x30353c;
    o.material = new THREE.MeshPhysicalMaterial({ color, metalness: glow ? 0 : 0.6, roughness: glow ? 0.3 : 0.42, flatShading: true,
      emissive: glow ? 0x6fd6ff : 0x000000, emissiveIntensity: glow ? 0.9 : 0 });
    parts.push({ o, y0: o.position.y, lift: lift(o.name.replace(/_\d+$/, '').replace(/^key.*/, 'key')) });
  });
  scene.add(g.scene);
}, undefined, (e) => { document.getElementById('msg').innerHTML = '<span class="err">Could not load assembly.glb. Serve this folder over HTTP (for example <code>python3 -m http.server</code>) and run console.py first.</span>'; });

let exploded = false, ex = 0;
const bx = document.getElementById('explode'), bs = document.getElementById('spin');
bx.onclick = () => { exploded = !exploded; bx.setAttribute('aria-pressed', exploded); };
bs.onclick = () => { controls.autoRotate = !controls.autoRotate; bs.setAttribute('aria-pressed', controls.autoRotate); };
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  ex += ((exploded ? 1 : 0) - ex) * Math.min(1, clock.getDelta() * 5);
  for (const p of parts) p.o.position.y = p.y0 + p.lift * ex;
  controls.target.y = 20 + 35 * ex;
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
