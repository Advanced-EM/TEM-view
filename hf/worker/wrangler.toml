# TEM-view session collector (Cloudflare Worker). Deploy: see README.md
name = "tem-view-collector"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

[vars]
DATASET_REPO = "rmsreis/tem-view-alignment"
ALLOWED_ORIGINS = "https://advanced-em.github.io,http://localhost:8765"

# at most 10 sessions per minute from one visitor (keyed on a daily salted hash, nothing stored)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# news mailing list (POST /subscribe). Create the namespace once with
#   npx wrangler kv namespace create SUBSCRIBERS
# and paste the id it prints below. List subscribers with
#   npx wrangler kv key list --binding SUBSCRIBERS --remote
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "PASTE_THE_ID_HERE"
